<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f8f8f8;
        }
        .chat-container {
            width: 90%;
            max-width: 400px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .messages {
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .input-container {
            display: flex;
            margin-top: 10px;
        }
        input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 8px 12px;
            margin-left: 5px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .back-btn {
            margin-bottom: 10px;
            background: #555;
            position: absolute;
            top: 20px;
            left: 20px;
        }
        .sent {
            text-align: right;
            background-color: #d1e7fd;
            padding: 5px;
            margin: 5px;
            border-radius: 5px;
        }
        
        .received {
            text-align: left;
            background-color: #f0f0f0;
            padding: 5px;
            margin: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="history.back()">Back</button>
    <div class="chat-container">
        <div class="messages" id="chat-box">
            <!-- Messages will be displayed here -->
            {% for message in messages %}
                <div class="{% if message.sender.id == request.session.user_id %}sent{% else %}received{% endif %}">
                    <strong>{{ message.sender.username }}:</strong> {{ message.message }}
                </div>
            {% empty %}
                <p>No messages yet. Start the conversation!</p>
            {% endfor %}
        </div>
        <div class="input-container">
            <input type="text" id="message" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script>
        function sendMessage() {
            let messageInput = document.getElementById('message');
            let messageText = messageInput.value.trim();
            let receiverId = "{{ receiver.id }}";  // Ensure receiver is passed from Django
        
            if (messageText !== "") {
                let formData = new FormData();
                formData.append("message", messageText);
        
                fetch(`/send_message/${receiverId}/`, {
                    method: "POST",
                    headers: {
                        "X-CSRFToken": "{{ csrf_token }}"  // Include CSRF token
                    },
                    body: formData  // Use FormData instead of JSON
                })
                .then(response => response.text())  // Expect plain text, not JSON
                .then(data => {
                    let chatBox = document.getElementById('chat-box');
                    let newMessage = document.createElement('div');
                    newMessage.textContent = messageText;
                    chatBox.appendChild(newMessage);
                    messageInput.value = "";
                    chatBox.scrollTop = chatBox.scrollHeight;
                })
                .catch(error => console.error("Error:", error));
            }
        }           
    </script>
    
</body>
</html>
