<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Users</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
        }
        .back-button {
            background: white;
            color: #28a745;
            padding: 8px 12px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
        }
        .back-button:hover {
            background: #ddd;
        }
        .search-container {
            display: flex;
            justify-content: center;
            padding: 20px;
            background-color: #28a745;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        .search-box {
            display: flex;
            border: 2px solid #218838;
            border-radius: 30px;
            overflow: hidden;
            background: white;
            width: 400px;
            box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: none;
            outline: none;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            border: none;
            background-color: #218838;
            color: white;
            cursor: pointer;
            font-size: 16px;
            border-radius: 0 30px 30px 0;
        }
        button:hover {
            background-color: #1e7e34;
        }

        /* Profile box styling */
        .results-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        .profile-box {
            background: white;
            border-radius: 10px;
            box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.2);
            width: 250px;
            padding: 15px;
            margin: 10px;
            text-align: center;
        }
        .profile-box img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
        }
        .profile-box h3 {
            margin: 5px 0;
            font-size: 18px;
            color: #333;
        }
        .profile-box p {
            margin: 3px 0;
            font-size: 14px;
            color: #555;
        }
        .view-profile {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }
        .view-profile:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <!-- Header with Back Button -->
    <div class="header">
        <a href="{% url 'profile' %}" class="back-button">Back</a>
        <h2>Search Users</h2>
    </div>

    <!-- Search Bar at the Top -->
    <div class="search-container">
        <form action="{% url 'search_users' %}" method="GET" class="search-box">
            <input type="text" name="q" placeholder="Enter username..." required>
            <button type="submit">Search</button>
        </form>
    </div>

    <!-- Results Section -->
    {% if query %}  <!-- Show results only when a search is made -->
    <div class="results-container">
        {% if users %}
            {% for user in users %}
                <div class="profile-box">
                    <img src="{{ user.photo.url }}" alt="Profile Picture">
                    <h3>{{ user.name }}</h3>
                    <p>Age: {{ user.age }}</p>
                    <p>District: {{ user.district }}</p>
                    <p>Education: {{ user.education }}</p>
                    <a href="{% url 'profile_detail' user.id %}" class="view-profile">View Profile</a>
                </div>
            {% endfor %}
        {% else %}
            <p style="text-align: center; color: #555;">No users found.</p>
        {% endif %}
    </div>
    {% endif %}
</body>
</html>
