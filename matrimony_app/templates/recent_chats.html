<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Chats</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            padding: 20px;
        }
        .chat-list {
            max-width: 500px;
            margin: auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 10px;
        }
        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .chat-item img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .chat-item div {
            flex-grow: 1;
        }
        .chat-item a {
            text-decoration: none;
            color: black;
        }
        .chat-item .last-message {
            font-size: 12px;
            color: #555;
        }
        .back-button {
            background-color: blue;
            color: white;
            margin-top: 20px;
            display: inline-block;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- Back button -->
    <a href="{% url 'profile' %}" class="back-button">Back</a>

    <h2 style="text-align: center;">Recent Chats</h2>
    <div class="chat-list">
        {% for chat in recent_chats %}
            <a href="{% url 'chat_view' receiver_id=chat.user.id %}" class="chat-item">
                <img src="{{ chat.user.photo.url }}" alt="Profile">
                <div>
                    <strong>{{ chat.user.name }}</strong>
                    <p class="last-message">{{ chat.last_message }}</p>
                </div>
            </a>
        {% empty %}
            <p style="text-align: center; color: #555;">No recent chats</p>
        {% endfor %}
    </div>
</body>
</html>
