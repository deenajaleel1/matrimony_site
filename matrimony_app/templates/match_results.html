<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .profile-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: 0.3s;
        }
        .profile-card:hover {
            transform: scale(1.05);
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }
        .like-button {
            border: none;
            background: none;
            color: red;
            font-size: 24px;
            cursor: pointer;
        }
        .view-profile {
            text-decoration:none;
            background-color: green;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
        }
    </style>
</head>
<body>
    <!-- Back button -->
    <a href="{% url 'matches' %}" class="btn btn-secondary back-button">Back</a>

    <div class="container">
        <h2 class="text-center">Match Results</h2>
        <div class="row">
            {% for match in matches %}
            <div class="col-md-4 mb-4">
                <div class="profile-card">
                    <img src="{{ match.photo.url }}" alt="Profile Picture" class="profile-img">
                    <h5 class="mt-2"><b>Name:</b>{{ match.name }}</h5>
                    <p><b>Age:</b> {{ match.age }}</p>
                    <p><b>District:</b> {{ match.district }}</p>
                    <button class="like-button">❤️</button>
                    <a href="{% url 'profile_detail' id=match.id %}" class="view-profile">View Profile</a>
                </div>
            </div>
            {% empty %}
            <p class="text-center">No matches found.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
